<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="TravelPlanner 旅行规划师：一句话需求，交付一份能离线打开的旅行路书">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#f3ece0"/>
    </linearGradient>
    <clipPath id="mapClip"><rect x="700" y="46" width="530" height="328" rx="18"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#5a3b22" flood-opacity="0.12"/>
    </filter>
    <style>
      .serif { font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif; }
      .sans { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="420" fill="url(#paper)"/>

  <!-- 左侧：标题 -->
  <g transform="translate(72 0)">
    <rect x="0" y="78" width="192" height="28" rx="14" fill="#a33a2c"/>
    <text x="96" y="97" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#fff" letter-spacing="2">DSH AGENT PRESET</text>

    <text x="0" y="178" class="serif" font-size="68" font-weight="700" fill="#2b2118">旅行规划师</text>
    <text x="3" y="222" class="sans" font-size="26" font-weight="600" fill="#a33a2c" letter-spacing="5">TravelPlanner</text>

    <text x="0" y="276" class="sans" font-size="21" fill="#5b4a3c">一句话需求，交付一份能离线打开的旅行路书</text>

    <g class="sans" font-size="15" fill="#6b5847">
      <rect x="0" y="304" width="106" height="32" rx="16" fill="#fff" stroke="#e4d8c6"/>
      <text x="53" y="325" text-anchor="middle">12306 余票</text>
      <rect x="118" y="304" width="132" height="32" rx="16" fill="#fff" stroke="#e4d8c6"/>
      <text x="184" y="325" text-anchor="middle">飞猪 · 途牛价格</text>
      <rect x="262" y="304" width="122" height="32" rx="16" fill="#fff" stroke="#e4d8c6"/>
      <text x="323" y="325" text-anchor="middle">高德真实路线</text>
      <rect x="396" y="304" width="152" height="32" rx="16" fill="#fff" stroke="#e4d8c6"/>
      <text x="472" y="325" text-anchor="middle">单文件 HTML 路书</text>
    </g>
  </g>

  <!-- 右侧：示意地图卡片 -->
  <g filter="url(#shadow)">
    <rect x="700" y="46" width="530" height="328" rx="18" fill="#f6f1e6"/>
  </g>
  <g clip-path="url(#mapClip)">
    <!-- 街区与绿地 -->
    <rect x="700" y="46" width="530" height="328" fill="#f6f1e6"/>
    <path d="M700 300 C 780 280, 830 330, 900 316 S 1010 260, 1080 290 S 1180 340, 1240 320 L1240 380 L700 380 Z" fill="#dcebd6"/>
    <circle cx="1150" cy="118" r="54" fill="#e3eedf"/>
    <path d="M760 46 C 790 140, 740 220, 790 374" stroke="#cfe0f0" stroke-width="16" fill="none"/>
    <!-- 道路 -->
    <g stroke="#fff" stroke-linecap="round" fill="none">
      <path d="M700 150 L1230 120" stroke-width="10"/>
      <path d="M700 250 L1230 232" stroke-width="8"/>
      <path d="M900 46 L880 374" stroke-width="9"/>
      <path d="M1060 46 L1090 374" stroke-width="7"/>
    </g>
    <g stroke="#ecd8a8" stroke-linecap="round" fill="none" stroke-width="3">
      <path d="M700 150 L1230 120"/>
      <path d="M900 46 L880 374"/>
    </g>
    <!-- 地铁线 -->
    <path d="M720 96 C 820 120, 860 190, 960 196 S 1120 170, 1210 214" stroke="#5aa86a" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- 真实路线 -->
    <path d="M770 120 C 830 160, 860 210, 930 222 S 1040 214, 1090 262 S 1150 300, 1180 286" stroke="#2f6fdb" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1180 286 L1200 250" stroke="#7a7a7a" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
  </g>

  <!-- 编号点 + 中文名 -->
  <g class="sans" font-size="14" font-weight="700">
    <g transform="translate(770 120)">
      <circle r="13" fill="#f39c12" stroke="#fff" stroke-width="3"/>
      <text y="5" text-anchor="middle" fill="#fff">1</text>
      <rect x="18" y="-14" width="82" height="26" rx="6" fill="#fff" opacity="0.95"/>
      <text x="59" y="4" text-anchor="middle" fill="#2b2118">大熊猫基地</text>
    </g>
    <g transform="translate(930 222)">
      <circle r="13" fill="#8e44ad" stroke="#fff" stroke-width="3"/>
      <text y="5" text-anchor="middle" fill="#fff">2</text>
      <rect x="18" y="-14" width="68" height="26" rx="6" fill="#fff" opacity="0.95"/>
      <text x="52" y="4" text-anchor="middle" fill="#2b2118">宽窄巷子</text>
    </g>
    <g transform="translate(1090 262)">
      <circle r="13" fill="#d63b3b" stroke="#fff" stroke-width="3"/>
      <text y="5" text-anchor="middle" fill="#fff">3</text>
      <rect x="-74" y="6" width="60" height="26" rx="6" fill="#fff" opacity="0.95"/>
      <text x="-44" y="24" text-anchor="middle" fill="#2b2118">春熙路</text>
    </g>
    <g transform="translate(1200 250)">
      <circle r="13" fill="#2f6fdb" stroke="#fff" stroke-width="3"/>
      <text y="5" text-anchor="middle" fill="#fff">4</text>
    </g>
  </g>

  <!-- 路段信息条 -->
  <g class="sans">
    <rect x="724" y="320" width="300" height="34" rx="17" fill="#fff" stroke="#e4d8c6"/>
    <circle cx="744" cy="337" r="6" fill="#2f6fdb"/>
    <text x="758" y="342" font-size="14" fill="#4a3b2f">地铁 2 号线 · 3.9 km · 21 分钟 · ¥2</text>
  </g>
  <g class="sans">
    <rect x="1048" y="62" width="164" height="30" rx="15" fill="#fff" stroke="#f0b35a"/>
    <text x="1130" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#b8650c">↘ 机场 · 直线 52 km</text>
  </g>
</svg>
